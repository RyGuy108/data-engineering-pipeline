[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-data-pipeline"
version = "0.2.1"
description = "Replayable NWS ingestion, PySpark quality checks, and an incremental analytical warehouse"
requires-python = ">=3.11,<3.14"
dependencies = ["pyspark==4.0.1", "duckdb==1.4.0", "requests==2.32.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.0"]

[project.scripts]
weather-pipeline = "weather_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weather_pipeline = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["spark: starts a local Spark JVM"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
