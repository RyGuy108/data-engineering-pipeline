name: Pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned test environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Lint and test all pipeline components
        run: |
          python -m ruff check src tests scripts
          python -m pytest -q
      - name: Build and inspect the distributable wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/check_release.py dist/weather_data_pipeline-*.whl
      - name: Exercise the installed wheel outside the checkout
        shell: bash
        run: |
          wheel_path=$(realpath dist/weather_data_pipeline-*.whl)
          release_environment="$RUNNER_TEMP/weather-release-venv"
          release_workdir=$(mktemp -d "$RUNNER_TEMP/weather-release-run.XXXXXX")
          python -m venv "$release_environment"
          "$release_environment/bin/python" -m pip install -r requirements.lock
          "$release_environment/bin/python" -m pip install --no-deps "$wheel_path"
          "$release_environment/bin/python" -m pip check
          unset PYTHONPATH
          export PYSPARK_PYTHON="$release_environment/bin/python"
          cd "$release_workdir"
          "$release_environment/bin/python" -I -c 'import json, sys; from pathlib import Path; from importlib.resources import files; import weather_pipeline; assert Path(weather_pipeline.__file__).is_relative_to(Path(sys.prefix)); assert json.loads(files("weather_pipeline").joinpath("examples/recorded-nws-sample.json").read_text())'
          "$release_environment/bin/weather-pipeline" --help
          "$release_environment/bin/weather-pipeline" demo --output-dir "$release_workdir/demo"
          "$release_environment/bin/python" -I -c 'import json; from pathlib import Path; assert json.loads(Path("demo/report.json").read_text())["status"] == "passed"; assert json.loads(Path("demo/tableau/audit.json").read_text())["status"] == "passed"'
